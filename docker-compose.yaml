services:
  db:
    container_name: championship_football
    image: postgres:17-alpine
    restart: always
    ports:
      - ${DB_PORT}:5432
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
